name: Claude transcript root proof

on:
  push:
    branches: [proof/claude-transcript-root-20260927]
    paths:
      - .github/workflows/pr145895-proof.yml
      - scripts/pr145895-proof/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pr145895-isolated-proof
  cancel-in-progress: false

jobs:
  schema23:
    if: github.repository == 'Szqub/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CI: "1"
      OPENCLAW_VITEST_MAX_WORKERS: "2"
      OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
    steps:
      - name: Require completed full proof on the identical production tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr145895-evidence"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/36356677685/jobs" --jq '{jobs: [.jobs[] | {name, conclusion, steps: [.steps[] | {name, conclusion}]}]}' > "$RUNNER_TEMP/pr145895-evidence/full-proof-steps.json"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const jobs=JSON.parse(fs.readFileSync(process.argv[1],"utf8")).jobs; const job=jobs.find(x=>x.name==="schema23"); for(const name of ["Run focused regression coverage","Verify same-schema older-writer compatibility and migration","Check types and import cycles","Build current-main runtime","Run isolated current-main Gateway and native Claude proof","Verify tracked source stayed unchanged"]) assert.equal(job?.steps.find(x=>x.name===name)?.conclusion,"success",name);' "$RUNNER_TEMP/pr145895-evidence/full-proof-steps.json"
      - name: Checkout exact schema-23 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8579e6c335b03c2cc3f86cb8eda71501247608c7
          fetch-depth: 8
          persist-credentials: false
      - name: Checkout proof tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: tooling
          sparse-checkout: scripts/pr145895-proof
          sparse-checkout-cone-mode: false
      - name: Verify candidate and prepare evidence
        run: |
          test "$(git rev-parse HEAD)" = 8579e6c335b03c2cc3f86cb8eda71501247608c7
          mkdir -p "$RUNNER_TEMP/pr145895-evidence"
          printf '%s\n' 'Unchanged schema20 candidate d165:545tests/13files and7compatibility phases passed in https://github.com/Szqub/openclaw/actions/runs/36354847709 . The pristine fixture comes from that exact run.' > "$RUNNER_TEMP/pr145895-evidence/schema20-reference.txt"
          printf 'candidate=%s\nparent=%s\nschema=%s\ntooling_sha=%s\nrun_id=%s\n' 8579e6c335b03c2cc3f86cb8eda71501247608c7 66898a633464e85e4aea8fd5a0fd2043c88025af 23 "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/pr145895-evidence/identity.txt"
      - name: Setup frozen candidate toolchain
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "26.x"
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"
      - name: Install candidate dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Check the skill-root fixture and regression first
        id: skill
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs run src/agents/cli-runner/prepare.test.ts -t 'skill-selected child config dir' 2>&1 | tee "$RUNNER_TEMP/pr145895-evidence/skill-root-focused.log"
      - name: Verify unchanged production against full proof candidate
        run: |
          git diff --exit-code 6677a20fbbc4d72e95dc38835c5d2dd06f88aa20 HEAD -- . ':(exclude)src/agents/cli-runner/prepare.test.ts'
          printf '%s\n' 'Only test cleanup braces changed since6677a20fbbc4. Full schema23 regressions, compatibility, upgrade, types and runtime are validated in run36356677685; this run checks final lint and the positive/negative regression.' > "$RUNNER_TEMP/pr145895-evidence/reused-proof.txt"
      - name: Verify skill-root regression detects the missing preparation overlay
        if: ${{ !cancelled() && steps.skill.outcome == 'success' }}
        run: |
          set -o pipefail
          cp src/agents/cli-runner/prepare.ts "$RUNNER_TEMP/prepare-fixed.ts"
          trap 'cp "$RUNNER_TEMP/prepare-fixed.ts" src/agents/cli-runner/prepare.ts' EXIT
          git show 3dd9e2aedad5e786bb3583d7b5fd8d88cd97dfbe:src/agents/cli-runner/prepare.ts > src/agents/cli-runner/prepare.ts
          set +e
          node scripts/run-vitest.mjs run src/agents/cli-runner/prepare.test.ts -t 'skill-selected child config dir' > "$RUNNER_TEMP/pr145895-evidence/skill-regression-negative.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const log=fs.readFileSync(process.argv[1],"utf8"); assert.match(log,/AssertionError/); assert.match(log,/missing-transcript/);' "$RUNNER_TEMP/pr145895-evidence/skill-regression-negative.log"
          printf 'Pre-fix preparation failed the targeted behavioral assertion (exit %s). Fixed version passed in focused coverage.\n' "$result" > "$RUNNER_TEMP/pr145895-evidence/skill-regression-negative.txt"
      - name: Check integration formatting and lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          git diff --check 66898a633464e85e4aea8fd5a0fd2043c88025af HEAD
          git diff --name-only -z 66898a633464e85e4aea8fd5a0fd2043c88025af HEAD -- src docs | xargs -0 pnpm exec oxfmt --check
          git diff --name-only -z 66898a633464e85e4aea8fd5a0fd2043c88025af HEAD -- src | xargs -0 node scripts/run-oxlint.mjs --tsconfig tsconfig.core.json 2>&1 | tee "$RUNNER_TEMP/pr145895-evidence/lint.log"
      - name: Upload preflight diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr145895-schema23-preflight
          path: ${{ runner.temp }}/pr145895-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Verify tracked source stayed unchanged
        if: always()
        run: git diff --exit-code HEAD
      - name: Upload schema-23 proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr145895-schema23-proof
          path: ${{ runner.temp }}/pr145895-evidence/
          if-no-files-found: error
          retention-days: 30
